version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
      POSTGRES_DB: demodb
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo"]
      interval: 5s
      retries: 10

  demo:
    build: .
    environment:
      DATABASE_URL: postgresql://demo:demo@postgres:5432/demodb
    depends_on:
      postgres:
        condition: service_healthy
