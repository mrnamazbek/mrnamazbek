<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Namazbek Bekzhanov | Data Engineering Portfolio</title>
    <meta name="description" content="Portfolio of Namazbek Bekzhanov - Data Engineer & Backend Developer.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;600&display=swap"
        rel="stylesheet">

    <!-- Devicon for Logos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        glass: {
                            100: 'rgba(255, 255, 255, 0.05)',
                            200: 'rgba(255, 255, 255, 0.1)',
                            border: 'rgba(255, 255, 255, 0.15)',
                        }
                    },
                    animation: {
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- GSAP for Anti-Gravity Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>

    <style>
        /* === LIQUID GLASS CORE === */
        :root {
            --glass-blur: 16px;
            --glass-saturation: 1.5;
            --cursor-size: 20px;
        }

        body {
            background-color: #050505;
            /* Deep Space Black */
            color: #ffffff;
            overflow-x: hidden;
            cursor: none;
            /* Hide default cursor */
        }

        /* Anti-Gravity Background Container */
        #anti-gravity-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
            /* subtle gradient mesh base */
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #000000 100%);
        }

        /* Floating Tech Icons */
        .tech-floater {
            position: absolute;
            font-size: 3rem;
            opacity: 0.15;
            will-change: transform;
            filter: blur(1px) grayscale(100%);
            transition: filter 0.3s;
        }

        /* Highlight floater near cursor (logic in JS) */
        .tech-floater.active {
            opacity: 0.6;
            filter: blur(0px) grayscale(0%);
            z-index: 0;
        }

        /* === CUSTOM CURSOR === */
        #cursor-dot,
        #cursor-outline {
            position: fixed;
            top: 0;
            left: 0;
            transform: translate(-50%, -50%);
            border-radius: 50%;
            z-index: 9999;
            pointer-events: none;
        }

        #cursor-dot {
            width: 8px;
            height: 8px;
            background-color: white;
        }

        #cursor-outline {
            width: 40px;
            height: 40px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            transition: width 0.2s, height 0.2s, background-color 0.2s;
        }

        /* Hover State for Cursor */
        body.hovering #cursor-outline {
            width: 60px;
            height: 60px;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(2px);
            border-color: transparent;
        }

        /* === LIQUID GLASS CARDS === */
        .liquid-glass {
            background: rgba(20, 20, 25, 0.4);
            backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation));
            -webkit-backdrop-filter: blur(var(--glass-blur)) saturate(var(--glass-saturation));
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
            border-left: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow:
                0 4px 30px rgba(0, 0, 0, 0.3),
                inset 0 0 20px rgba(255, 255, 255, 0.05);
            /* Edge lighting */
            border-radius: 20px;
        }

        /* Text readability backing */
        .text-backing {
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0a0a0a;
        }

        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        /* MOBILE / PERFORMANCE FALLBACKS */
        @media (max-width: 768px),
        (prefers-reduced-motion: reduce) {
            body {
                cursor: auto;
            }

            #cursor-dot,
            #cursor-outline {
                display: none;
            }

            .tech-floater {
                animation: none !important;
                transition: none !important;
            }

            .liquid-glass {
                backdrop-filter: blur(10px);
            }

            /* Reduced blur cost */
        }
    </style>
</head>

<body class="antialiased">

    <!-- Anti-Gravity Background -->
    <div id="anti-gravity-canvas"></div>

    <!-- Custom Cursor -->
    <div id="cursor-dot"></div>
    <div id="cursor-outline"></div>

    <!-- Main Layout -->
    <main class="relative z-10 px-4 pt-12 pb-24 max-w-6xl mx-auto space-y-32">

            <div
                class="font-mono font-bold text-xl tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-200 to-cyan-400">
                NB.DEV</div>
            <div class="flex gap-4">
                <a href="#projects"
                    class="text-sm font-medium text-gray-300 hover:text-white transition hover-trigger">Projects</a>
                <a href="#library"
                    class="text-sm font-medium text-gray-300 hover:text-white transition hover-trigger">Library</a>
            </div>
        </nav>

        <!-- HERO SECTION -->
        <section class="flex flex-col md:flex-row gap-12 items-center min-h-[60vh]">
            <div class="flex-1 space-y-6">
                <div
                    class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-cyan-900/30 border border-cyan-500/30 text-cyan-300 text-xs font-mono">

                        <span
                            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-cyan-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-cyan-500"></span>
                    </span>
                    Open to Work
                </div>
                <h1 id="hero-name" class="text-5xl md:text-7xl font-bold tracking-tight leading-tight">
                    <!-- Injected via JS -->
                </h1>
                <h2 id="hero-title" class="text-xl md:text-2xl text-gray-400 font-light">
                    <!-- Injected via JS -->
                </h2>
                <p id="hero-bio" class="text-gray-300 max-w-lg leading-relaxed text-backing">
                    <!-- Injected via JS -->
                </p>
                <div id="hero-socials" class="flex gap-4 pt-4">
                    <!-- Injected via JS -->
                </div>
            </div>

            <!-- Glass Stats Card (Tilt Effect) -->
            <div id="tilt-card"
                class="liquid-glass p-8 w-full max-w-sm transform transition duration-100 ease-out hover-trigger">
                <div class="grid grid-cols-2 gap-8 text-center">
                    <div>
                        <div class="text-3xl font-mono font-bold text-cyan-400 mb-1" id="stat-repos">0</div>
                        <div class="text-xs text-gray-500 uppercase tracking-widest">Repos</div>
                    </div>
                    <div>
                        <div class="text-3xl font-mono font-bold text-purple-400 mb-1">10+</div>
                        <div class="text-xs text-gray-500 uppercase tracking-widest">Certificates</div>
                    </div>
                    <div>
                        <div class="text-3xl font-mono font-bold text-green-400 mb-1">3+</div>
                        <div class="text-xs text-gray-500 uppercase tracking-widest">Years</div>
                    </div>
                    <div>
                        <div class="text-3xl font-mono font-bold text-pink-400 mb-1">12</div>
                        <div class="text-xs text-gray-500 uppercase tracking-widest">Books</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- PROJECTS GRID -->
        <section id="projects">
            <h3 class="text-3xl font-bold mb-8 flex items-center gap-3">
                <span class="w-8 h-[2px] bg-cyan-500"></span> Selected Projects
            </h3>
            <div id="projects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- THE LIBRARY (Books) -->
        <section id="library">
            <h3 class="text-3xl font-bold mb-8 flex items-center gap-3">
                <span class="w-8 h-[2px] bg-purple-500"></span> The Library
            </h3>
            <div id="books-carousel"
                class="flex overflow-x-auto gap-8 pb-12 snap-x snap-mandatory custom-scrollbar p-2">
                <!-- Injected via JS -->
            </div>
        </section>

        <!-- FOOTER -->
        <footer class="text-center text-gray-600 text-sm pb-8 font-mono">
            <p>Engineered with Liquid Glass & Anti-Gravity Physics.</p>
            <p class="opacity-50 mt-2">&copy; 2026 Namazbek Bekzhanov.</p>
        </footer>

    </main>

    <!-- LOGIC SCRIPT -->
    <script>
        // === 1. DATA MODEL ===
        const DATA = {
            "user": {
                "name": "Namazbek Bekzhanov",
                "title": "Middle Data Engineer | Backend Developer",
                "location": "Almaty, Kazakhstan",
                "bio": "Building reliable enterprise ETL/ELT pipelines, architecting advanced data warehouses, and creating resilient scalable backend systems."
            },
            "socials": {
                "github": "https://github.com/mrnamazbek",
                "linkedin": "https://linkedin.com/in/namazbek-bekzhanov"
            },
            "tools": [
                "python", "fastapi", "postgresql", "oracle", "apacheairflow", "apachekafka", "apachespark", "docker", "kubernetes", "grafana", "dbt", "clickhouse"
            ],
            "projects": [ // Fallback
                { "name": "Big Data Pipeline on GCP", "link": "#", "description": "IaC data ingestion using Terraform, PySpark, Kafka, and BigQuery.", "thumb": "https://images.unsplash.com/photo-1551288049-bebda4e38f71?auto=format&fit=crop&w=400&q=80" },
                { "name": "DWH Implementation", "link": "#", "description": "Kimball style Data Warehouse with dbt models and Airflow orchestration.", "thumb": "https://images.unsplash.com/photo-1555066931-4365d14bab8c?auto=format&fit=crop&w=400&q=80" }
            ],
            "books": [
                { "title": "Clean Code", "author": "Robert C. Martin", "cover": "https://images.unsplash.com/photo-1516116216624-53e697fedbea?auto=format&fit=crop&w=300&q=80" },
                { "title": "Designing Data-Intensive Applications", "author": "Martin Kleppmann", "cover": "https://images.unsplash.com/photo-1589829085413-56de8ae18c73?auto=format&fit=crop&w=300&q=80" },
                { "title": "Fundamentals of Data Engineering", "author": "Joe Reis & Matt Housley", "cover": "https://images.unsplash.com/photo-1550751827-4bd374c3f58b?auto=format&fit=crop&w=300&q=80" },
                { "title": "The Data Warehouse Toolkit", "author": "Ralph Kimball", "cover": "https://images.unsplash.com/photo-1526379095098-d400fd0bfce8?auto=format&fit=crop&w=300&q=80" },
                { "title": "Data Mesh", "author": "Zhamak Dehghani", "cover": "https://images.unsplash.com/photo-1451187580459-43490279c0fa?auto=format&fit=crop&w=300&q=80" },
                { "title": "Database Internals", "author": "Alex Petrov", "cover": "https://images.unsplash.com/photo-1518770660439-4636190af475?auto=format&fit=crop&w=300&q=80" }
            ]
        };

        // === 2. PERFORMANCE CHECKS ===
        const isLowPower = (navigator.hardwareConcurrency && navigator.hardwareConcurrency <= 4) || window.innerWidth < 768;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        console.log(`Perf Check: LowPower=${isLowPower}, ReducedMotion=${prefersReducedMotion}`);

        // === 3. RENDER CONTENT ===
        function renderContent() {
            // User Info
            document.getElementById('hero-name').innerText = DATA.user.name;
            document.getElementById('hero-title').innerText = DATA.user.title;
            document.getElementById('hero-bio').innerText = DATA.user.bio;

            // Socials
            const socialContainer = document.getElementById('hero-socials');
            // GitHub
            const ghBtn = document.createElement('a');
            ghBtn.href = DATA.socials.github;
            ghBtn.target = "_blank";
            ghBtn.className = "liquid-glass px-6 py-2 hover:bg-white/10 transition flex items-center gap-2 hover-trigger";
            ghBtn.innerHTML = '<i class="devicon-github-original text-xl"></i> GitHub';
            socialContainer.appendChild(ghBtn);

            // LinkedIn
            const liBtn = document.createElement('a');
            liBtn.href = DATA.socials.linkedin;
            liBtn.target = "_blank";
            liBtn.className = "liquid-glass px-6 py-2 hover:bg-white/10 transition flex items-center gap-2 hover-trigger";
            liBtn.innerHTML = '<i class="devicon-linkedin-plain text-xl text-blue-400"></i> LinkedIn';
            socialContainer.appendChild(liBtn);

            // Fetch GitHub Projects (Live)
            fetchGitHubRepos();

            // Render Books
            const bookContainer = document.getElementById('books-carousel');
            DATA.books.forEach(book => {
                const bookCard = document.createElement('div');
                bookCard.className = "min-w-[200px] snap-center hover-trigger group";
                bookCard.innerHTML = `
                    <div class="relative w-[200px] h-[300px] rounded-lg overflow-hidden shadow-2xl transition transform group-hover:-translate-y-2 border border-white/10">
                        <img src="${book.cover}" loading="lazy" class="w-full h-full object-cover" alt="Cover of ${book.title}">
                        <div class="absolute inset-x-0 bottom-0 bg-black/80 backdrop-blur-md p-3 translate-y-full group-hover:translate-y-0 transition duration-300">
                            <h4 class="text-sm font-bold text-white leading-tight">${book.title}</h4>
                            <p class="text-xs text-gray-400 mt-1">${book.author}</p>
                        </div>
                    </div>
                `;
                bookContainer.appendChild(bookCard);
            });
        }

        async function fetchGitHubRepos() {
            const grid = document.getElementById('projects-grid');
            const repoUrl = `https://api.github.com/users/mrnamazbek/repos?sort=updated&per_page=6`;

            try {
                const res = await fetch(repoUrl);
                if (!res.ok) throw new Error("API Limit");
                const repos = await res.json();

                document.getElementById('stat-repos').innerText = repos.length + "+";
                grid.innerHTML = ''; // Clear fallback if needed, though we start empty

                repos.forEach(repo => renderProjectCard(repo, grid));
            } catch (err) {
                console.warn("GitHub fetch failed, loading fallback.", err);
                DATA.projects.forEach(proj => renderProjectCard(proj, grid, true));
            }
        }

        function renderProjectCard(repo, container, isLocal = false) {
            const card = document.createElement('a');
            card.href = isLocal ? repo.link : repo.html_url;
            card.target = "_blank";
            card.className = "liquid-glass p-6 group hover:border-cyan-500/30 transition duration-300 flex flex-col justify-between h-[250px] hover-trigger";

            card.innerHTML = `
                <div>
                     <div class="flex items-center gap-2 text-cyan-400 mb-3 text-sm font-mono">
                        <i class="devicon-${(repo.language || 'python').toLowerCase()}-plain"></i>
                        ${repo.language || 'Project'}
                    </div>
                    <h3 class="text-xl font-bold mb-2 group-hover:text-cyan-200 transition">${repo.name}</h3>
                    <p class="text-gray-400 text-sm leading-relaxed line-clamp-3">
                        ${repo.description || 'No description available.'}
                    </p>
                </div>
                <div class="text-xs text-gray-500 font-mono mt-4">View Source -></div>
            `;
            container.appendChild(card);
        }

        // === 4. ANTI-GRAVITY BACKGROUND ENGINE ===
        function initAntiGravity() {
            if (isLowPower || prefersReducedMotion) return;

            const canvas = document.getElementById('anti-gravity-canvas');
            const icons = DATA.tools;
            const floaters = [];

            // Spawn Icons
            icons.forEach((iconName) => {
                const el = document.createElement('i');
                // Handle devicon naming weirdness if needed, mostly standard
                // e.g. 'apacheairflow' vs 'apache-airflow' can vary in specific fonts, assuming Devicon latest handles generic
                // Or simplified list mapping.
                // Using a safe generic class approach:
                el.className = `tech-floater devicon-${iconName}-plain`;

                // Random Positioning
                const x = Math.random() * window.innerWidth;
                const y = Math.random() * window.innerHeight;
                const size = 30 + Math.random() * 50; // Random size

                el.style.left = `${x}px`;
                el.style.top = `${y}px`;
                el.style.fontSize = `${size}px`;
                el.style.transform = `rotate(${Math.random() * 360}deg)`;

                // Store physics state
                const floater = {
                    el: el,
                    x: x,
                    y: y,
                    vx: (Math.random() - 0.5) * 0.5, // Velocity X
                    vy: (Math.random() - 0.5) * 0.5, // Velocity Y
                    rot: Math.random() * 360,
                    rotSpeed: (Math.random() - 0.5) * 0.2
                };

                floaters.push(floater);
                canvas.appendChild(el);
            });

            // Physics Loop
            let mouseX = window.innerWidth / 2;
            let mouseY = window.innerHeight / 2;

            document.addEventListener('mousemove', (e) => {
                mouseX = e.clientX;
                mouseY = e.clientY;
            });

            function tick() {
                floaters.forEach(f => {
                    // 1. Basic Drift
                    f.x += f.vx;
                    f.y += f.vy;
                    f.rot += f.rotSpeed;

                    // 2. Mouse Avoidance / Parallax (JetBrains style repulse)
                    const dx = f.x - mouseX;
                    const dy = f.y - mouseY;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < 300) {
                        const angle = Math.atan2(dy, dx);
                        const force = (300 - dist) * 0.005; // Gentle push
                        f.vx += Math.cos(angle) * force;
                        f.vy += Math.sin(angle) * force;
                        f.el.classList.add('active'); // Highlight
                    } else {
                        f.el.classList.remove('active');
                    }

                    // 3. Friction (Damping) to stop infinite acceleration
                    f.vx *= 0.98;
                    f.vy *= 0.98;

                    // 4. Boundary Wrap (Pacman style)
                    if (f.x < -50) f.x = window.innerWidth + 50;
                    if (f.x > window.innerWidth + 50) f.x = -50;
                    if (f.y < -50) f.y = window.innerHeight + 50;
                    if (f.y > window.innerHeight + 50) f.y = -50;

                    // Apply
                    f.el.style.transform = `translate3d(${f.x}px, ${f.y}px, 0) rotate(${f.rot}deg)`;
                });

                requestAnimationFrame(tick);
            }

            tick();
        }

        // === 5. CUSTOM CURSOR ===
        function initCursor() {
            if (isLowPower || prefersReducedMotion) return;

            const dot = document.getElementById('cursor-dot');
            const outline = document.getElementById('cursor-outline');

            document.addEventListener('mousemove', (e) => {
                const { clientX, clientY } = e;

                // Dot follows immediately
                dot.style.transform = `translate(${clientX}px, ${clientY}px)`;

                // Outline follows with lag (GSAP)
                gsap.to(outline, {
                    x: clientX,
                    y: clientY,
                    duration: 0.15,
                    ease: "power2.out"
                });
            });

            // Hover effects
            const triggers = document.querySelectorAll('.hover-trigger');
            triggers.forEach(t => {
                t.addEventListener('mouseenter', () => document.body.classList.add('hovering'));
                t.addEventListener('mouseleave', () => document.body.classList.remove('hovering'));
            });
        }

        // === INIT ===
        window.addEventListener('DOMContentLoaded', () => {
            renderContent();
            initAntiGravity();
            initCursor();
        });

    </script>

      [x] Mobile performance optimized (checks for lowPowerMode).
