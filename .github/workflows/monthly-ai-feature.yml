name: Monthly AI Feature Autopilot

on:
  schedule:
    # Monthly on day 2 at 04:00 UTC
    - cron: '0 4 2 * *'
  workflow_dispatch:
    inputs:
      force_regenerate:
        description: Force regeneration even if this month already exists
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: monthly-ai-feature-autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      AI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      AI_MODEL: ${{ vars.AI_MODEL != '' && vars.AI_MODEL || 'gpt-5.2' }}
      AI_BASE_URL: ${{ vars.AI_BASE_URL != '' && vars.AI_BASE_URL || 'https://api.openai.com/v1' }}
      GOOGLE_TRENDS_GEO: ${{ vars.GOOGLE_TRENDS_GEO != '' && vars.GOOGLE_TRENDS_GEO || 'KZ' }}
      AI_REVIEW_MIN_SCORE: ${{ vars.AI_REVIEW_MIN_SCORE != '' && vars.AI_REVIEW_MIN_SCORE || '75' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Setup Node 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Validate AI credentials
        run: |
          if [ -z "${AI_API_KEY}" ]; then
            echo "::warning::Missing OPENAI_API_KEY secret. Pipeline will generate deterministic trend-based fallback feature."
          else
            echo "AI credentials configured."
          fi

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright binaries
        uses: actions/cache@v4.2.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Generate monthly feature from trends + AI
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_regenerate }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python scripts/monthly_ai_feature_pipeline.py ${FORCE_FLAG}

      - name: Synchronize validated feed snapshots
        run: npm run content:sync -- --only=monthlyFeature,featureHistory

      - name: Build Next.js site with refreshed content
        run: npm run build

      - name: Run migrated site tests
        run: npm run test:e2e

      - name: Publish validated feature snapshots to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "${SUPABASE_URL}" ] && [ -n "${SUPABASE_SECRET_KEY}" ]; then
            npm run content:sync:database -- --only=monthlyFeature,featureHistory
          else
            echo "Supabase feed publication is unconfigured; repository snapshots were updated."
          fi

      - name: Lighthouse mobile audit
        run: |
          mkdir -p artifacts
          npm run start -- --hostname 127.0.0.1 --port 4173 >/tmp/next-server.log 2>&1 &
          SERVER_PID=$!
          trap "kill $SERVER_PID" EXIT
          for CHECK in $(seq 1 30); do
            if curl -fs http://127.0.0.1:4173/api/health >/dev/null; then break; fi
            sleep 1
          done

          CHROME_PATH=$(node -e "process.stdout.write(require('@playwright/test').chromium.executablePath())")
          if [ -z "${CHROME_PATH}" ]; then
            echo "Playwright Chromium not found, skipping Lighthouse."
            exit 0
          fi
          echo "Using Chromium for Lighthouse: ${CHROME_PATH}"

          set +e
          LH_EXIT=1
          for ATTEMPT in 1 2 3; do
            echo "Lighthouse attempt ${ATTEMPT}/3"
            npx lighthouse http://127.0.0.1:4173 \
              --quiet \
              --chrome-path="${CHROME_PATH}" \
              --chrome-flags="--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu" \
              --only-categories=performance,accessibility,best-practices,seo \
              --form-factor=mobile \
              --screenEmulation.mobile=true \
              --screenEmulation.width=375 \
              --screenEmulation.height=812 \
              --screenEmulation.deviceScaleFactor=2 \
              --output=json \
              --output=html \
              --output-path=artifacts/lighthouse-mobile
            LH_EXIT=$?
            if [ "${LH_EXIT}" -eq 0 ]; then
              break
            fi
            sleep 5
          done
          set -e

          if [ "${LH_EXIT}" -ne 0 ]; then
            echo "Lighthouse failed after retries; continuing without blocking the release."
          fi

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: monthly-ai-feature-artifacts
          if-no-files-found: warn
          path: |
            artifacts/lighthouse-mobile.report.html
            artifacts/lighthouse-mobile.report.json
            artifacts/monthly-feature-brief.md
            playwright-report

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ai_monthly_feature.json assets/ai_feature_history.json tests/monthly-ai-feature.spec.js src/content/snapshots/ai_monthly_feature.json src/content/snapshots/ai_feature_history.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          COMMIT_MSG=$(cat artifacts/monthly-feature-commit-message.txt 2>/dev/null || echo "feat: monthly AI feature update")
          git commit -m "$COMMIT_MSG [skip ci]"
          git push
