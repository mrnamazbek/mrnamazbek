---
name: Update DB ranking JSON

on:
  schedule:
    # Monthly: run on the 2nd day of month at 03:15 UTC
    - cron: '15 3 2 * *'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-db-ranking
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Python 3.12
        uses: actions/setup-python@v5.4.0
        with:
          python-version: '3.12'

      - name: Update JSON
        run: python scripts/update_db_ranking.py

      - name: Setup Node.js 22
        uses: actions/setup-node@v4.2.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install site dependencies
        run: npm ci

      - name: Synchronize validated ranking snapshot
        run: npm run content:sync -- --only=rankings

      - name: Publish validated ranking snapshot to Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          if [ -n "${SUPABASE_URL}" ] && [ -n "${SUPABASE_SECRET_KEY}" ]; then
            npm run content:sync:database -- --only=rankings
          else
            echo "Supabase feed publication is unconfigured; repository snapshot was updated."
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/db_ranking.json src/content/snapshots/db_ranking.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore: update db ranking dataset [skip ci]"
          git push
