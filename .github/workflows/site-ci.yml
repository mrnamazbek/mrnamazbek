name: Next.js site checks

on:
  push:
    branches: [main, 'codex/**']
    paths: ['src/**', 'supabase/**', 'scripts/**', 'assets/**', 'package*.json', '*config*', '.github/workflows/site-ci.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-browser-report
          path: playwright-report
          if-no-files-found: ignore
