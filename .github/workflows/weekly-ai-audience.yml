name: Weekly AI Audience Pulse Update

on:
  schedule:
    # Every Monday at 04:30 UTC
    - cron: '30 4 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-ai-audience-pulse
  cancel-in-progress: false

jobs:
  update-audience:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update weekly AI audience dataset
        run: python scripts/update_ai_audience_weekly.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS dependencies
        run: npm install

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run audience and engagement smoke test
        run: npx playwright test tests/ai-audience-engagement.spec.js

      - name: Commit and push dataset updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/ai_audience_weekly.json
          if git diff --cached --quiet; then
            echo "No dataset changes to commit"
            exit 0
          fi
          git commit -m "chore: update weekly AI audience pulse dataset"
          git push
