name: Telegram feed

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export latest channel posts
        run: python scripts/update_telegram_feed.py --channel tech_digest_kz
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/telegram_posts.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/telegram_posts.json
            git commit -m "chore(feed): update Telegram posts"
            git push
          fi
